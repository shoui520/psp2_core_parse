[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psp2-core-parse"
version = "0.2.0"
description = "PlayStation Vita psp2core coredump analyzer and debugger"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "psp2_core_parse contributors"}]

[project.optional-dependencies]
kernel = ["cryptography>=41"]
crypto = ["cryptography>=3.4"]

[project.scripts]
psp2-core-parse = "psp2_core_parse.cli:main"
psp2_core_parse = "psp2_core_parse.cli:main"

[tool.setuptools]
packages = ["psp2_core_parse"]
license-files = ["LICENSE", "LICENSES/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
